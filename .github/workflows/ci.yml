name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel previous in-flight runs of the same workflow on the same ref. This
# kicks in for both branch pushes (refs/heads/<name>, including main pushes
# and merges) and pull-request synchronisations (refs/pull/<num>/merge),
# so a rapid succession of pushes only ever consumes runner time for the
# latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated rather than inherited. The repository default is
# currently `read` (`GET /actions/permissions/workflow` →
# `default_workflow_permissions: read`, checked 2026-08-01), but that is a
# repo setting outside this tree that one admin toggle flips to `write`.
# These jobs execute every build script and proc macro in the
# `--all-features` dependency closure — `aws-lc-fips-sys`'s C build
# included, and under coverage instrumentation in check-sim-coverage — so
# the token they see should not depend on a setting they cannot see.
# `moonpool-seed-sweep.yml` already sets the precedent. No job here writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  fmt:
    name: fmt (nightly)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --check --all

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    # 90 min covers `--workspace --all-features` clippy on a cold
    # cache (aws-lc-fips-sys + bindgen for libgssapi dominate, ~15 min
    # alone) plus the lint pass on every test binary the admin /
    # CLI / e2e expansion now ships. The previous 60 min was tight
    # against the post-PR-5 surface.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `magnetar-auth-sasl/kerberos` (and the façade's
      # `auth-sasl-kerberos`) pull in `libgssapi`, which links against
      # MIT KRB5 / GSSAPI. The Ubuntu runner has the runtime libraries
      # but not the development headers; install them so `--all-features`
      # can resolve `krb5-gssapi.pc`. See ADR-0029.
      - name: Install libkrb5-dev + libclang-dev (for libgssapi via bindgen)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      # `--all-features` above enables `buggify`, which cfg-strips every
      # `#[cfg(not(feature = "buggify"))]` stub — so it never lints the
      # no-buggify axis that `seed-replay` (below) and
      # `moonpool-seed-sweep.yml` actually build and test. Lint that
      # exact single-provider cell here explicitly (issue #438). Without
      # `--no-deps`, this also lints magnetar-proto/magnetar-auth-sasl/
      # magnetar-auth-athenz/magnetar-messagecrypto at this feature
      # combination, which doubles as an incidental rustc-warning gate
      # for that axis since the seed cells carry no `-D warnings`.
      - run: cargo clippy -p magnetar-runtime-moonpool --all-targets --no-default-features --features crypto-aws-lc-rs --locked -- -D warnings
      # `--all-features` above also turns `schema-avro` on (ADR-0117), so it
      # can never see a missing `#[cfg(feature = "schema-avro")]` gate or a
      # test that links `apache-avro` without declaring it. Lint the build a
      # user gets with no feature selected, one package per invocation so that
      # a dev-dependency of one cannot switch the feature back on for the
      # other: `magnetar-proto` with every test target, and the façade
      # library (its test targets link `schema-avro` on purpose).
      - run: cargo clippy -p magnetar-proto --all-targets --locked -- -D warnings
      - run: cargo clippy -p magnetar-driver --lib --locked -- -D warnings
      # `--all-features` above also turns on every façade engine, so it
      # never sees the `magnetar-driver` library a `default-features = false`
      # consumer builds, where every `tokio`-only item is cfg-stripped and an
      # ungated helper they alone use becomes dead code. Lint that library,
      # then its unit-test target. The test target links every
      # dev-dependency, so `--no-deps` keeps that pass on the façade. Its
      # integration tests and examples need an engine and are not built here.
      - run: cargo clippy -p magnetar-driver --no-default-features --lib --locked -- -D warnings
      - run: cargo clippy -p magnetar-driver --no-default-features --lib --profile test --no-deps --locked -- -D warnings

  build:
    name: build (${{ matrix.toolchain }})
    runs-on: ubuntu-26.04
    # 90 min: same rationale as clippy — `--all-features` cold-cache
    # build on the runner takes ~20–25 min for the FIPS C build, plus
    # the workspace + every test binary's rlibs. Beta toolchain can
    # add a few minutes on top.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # ADR-0029: `auth-sasl-kerberos` → `libgssapi` needs MIT KRB5
      # headers. Runtime libs ship by default; the -dev package only.
      - name: Install libkrb5-dev + libclang-dev (for libgssapi via bindgen)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - run: cargo build --workspace --all-features --locked

  test:
    name: test (non-e2e)
    # ADR-0098 splits the former aggregate job into one non-e2e cell (this job)
    # and four e2e cells per Pulsar broker version (the `e2e` job below).
    # ADR-0046 still governs semantics: no e2e feature gate or #[ignore].
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          preinstalled-runtimes: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libkrb5-dev + libclang-dev (for libgssapi via bindgen)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - name: Run non-e2e tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          cargo test --workspace --exclude magnetar-driver --all-features --locked -- --nocapture
          cargo test -p magnetar-driver --all-features --locked --lib -- --nocapture
          cargo test -p magnetar-driver --all-features --locked --doc -- --nocapture
          paths=(crates/magnetar/tests/*.rs)
          for path in "${paths[@]}"; do
            target="${path##*/}"
            target="${target%.rs}"
            case "$target" in
              e2e_*) continue ;;
            esac
            cargo test -p magnetar-driver --all-features --locked --test "$target" -- --nocapture
          done

  differential-quarantine:
    name: differential quarantine diagnostics
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libkrb5-dev + libclang-dev (for libgssapi via bindgen)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - name: Compile quarantined differential targets
        run: |
          set -euo pipefail
          cargo test -p magnetar-differential --all-features --locked --test stream_consumer_equivalence --no-run
          cargo test -p magnetar-differential --all-features --locked --test stream_consumer_advanced_equivalence --no-run
      - name: Verify aggregate receiver budget selection
        run: |
          set -euo pipefail
          selected=$(cargo test -p magnetar-differential --all-features --locked --test stream_consumer_equivalence -- --ignored --exact aggregate_receiver_budget_is_equivalent --list)
          printf '%s\n' "$selected"
          count=$(printf '%s\n' "$selected" | awk '/^aggregate_receiver_budget_is_equivalent: test$/ { count++ } END { print count + 0 }')
          test "$count" -eq 1
      - name: Run aggregate receiver budget diagnostic
        id: run_aggregate_receiver_budget
        continue-on-error: true
        run: cargo test -p magnetar-differential --all-features --locked --test stream_consumer_equivalence -- --ignored --exact aggregate_receiver_budget_is_equivalent --nocapture
      - name: Verify busy and withdrawn child opens selection
        run: |
          set -euo pipefail
          selected=$(cargo test -p magnetar-differential --all-features --locked --test stream_consumer_advanced_equivalence -- --ignored --exact busy_and_withdrawn_child_opens_are_equivalent --list)
          printf '%s\n' "$selected"
          count=$(printf '%s\n' "$selected" | awk '/^busy_and_withdrawn_child_opens_are_equivalent: test$/ { count++ } END { print count + 0 }')
          test "$count" -eq 1
      - name: Run busy and withdrawn child opens diagnostic
        id: run_busy_child_opens
        continue-on-error: true
        run: cargo test -p magnetar-differential --all-features --locked --test stream_consumer_advanced_equivalence -- --ignored --exact busy_and_withdrawn_child_opens_are_equivalent --nocapture
      - name: Report quarantined differential results
        if: always()
        env:
          AGGREGATE_OUTCOME: ${{ steps.run_aggregate_receiver_budget.outcome }}
          BUSY_CHILD_OUTCOME: ${{ steps.run_busy_child_opens.outcome }}
        run: |
          {
            printf '%s\n' "aggregate_receiver_budget_is_equivalent: $AGGREGATE_OUTCOME (diagnostic; test result does not gate CI)."
            printf '%s\n' "busy_and_withdrawn_child_opens_are_equivalent: $BUSY_CHILD_OUTCOME (diagnostic; test result does not gate CI)."
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e (Pulsar ${{ matrix.pulsar }})
    # The whole e2e suite once per Pulsar version (ADR-0116): `pulsar` is the
    # tag every Broker::Default suite boots, handed to the reusable workflow as
    # MAGNETAR_PULSAR_IMAGE_TAG. Cells render as `e2e (Pulsar 5.0.0) / e2e 3/4`.
    # The default broker (DEFAULT_TAG of crates/magnetar/tests/common/pulsar.rs, the
    # release Clever Cloud runs) is the one that also brings up the PIP-33
    # two-cluster fixture, which is pinned to that same tag. 4.0.14 runs nightly in
    # e2e-nightly.yml. No axis is allowed to fail: no `continue-on-error`, no
    # per-version #[ignore].
    # `cargo run -p xtask -- check-e2e-fixture` reads these `pulsar:` values.
    strategy:
      fail-fast: false
      matrix:
        include:
          - pulsar: "4.2.5"
            pip33: true
          - pulsar: "5.0.0"
            pip33: false
    uses: ./.github/workflows/e2e-pulsar.yml
    with:
      pulsar: ${{ matrix.pulsar }}
      pip33: ${{ matrix.pip33 }}

  e2e-quarantine:
    name: e2e quarantine diagnostics (Pulsar 5.0.0)
    uses: ./.github/workflows/e2e-pulsar.yml
    with:
      pulsar: "5.0.0"
      quarantine_test: e2e_seek_per_partition_callback

  seed-replay:
    # Per ADR-0047: replay every `status = "open"` seed listed in
    # `crates/magnetar-runtime-moonpool/seeds/known-failing.toml` on every
    # push to `main` and every PR. The daily moonpool-seed-sweep workflow
    # is still where new seeds get *discovered*; this job is where
    # already-known regressions get caught before they can re-merge.
    # No-op (trivially green) when the registry is empty.
    name: seed-replay (regression guard)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Replay every open failing seed
        env:
          REGISTRY: crates/magnetar-runtime-moonpool/seeds/known-failing.toml
        run: |
          set -euo pipefail
          # Parse the TOML; emit `<value>` per `[[seed]]` with status="open".
          # Python 3.11+ ships `tomllib` in the stdlib; the pinned runner
          # image carries a supported Python version.
          mapfile -t seeds < <(python3 - <<'PY'
          import tomllib, os, sys
          path = os.environ["REGISTRY"]
          try:
              with open(path, "rb") as fh:
                  data = tomllib.load(fh)
          except FileNotFoundError:
              sys.exit(0)
          for entry in data.get("seed", []):
              if entry.get("status", "open") == "open":
                  print(entry["value"])
          PY
          )
          if [ "${#seeds[@]}" -eq 0 ]; then
            echo "Registry has no open seeds — replay trivially passes."
            exit 0
          fi
          echo "Replaying ${#seeds[@]} open seed(s) from the registry:"
          printf '  %s\n' "${seeds[@]}"
          # Single crypto provider per ADR-0035 (the providers are
          # mutually pluggable; `--all-features` activates every one of
          # them and is reserved for the per-cell `check-crypto-matrix`
          # xtask). `crypto-aws-lc-rs` matches the workspace default and
          # satisfies the moonpool sim invariants without dragging the
          # FIPS C toolchain in. Mirror this in
          # `.github/workflows/moonpool-seed-sweep.yml` so the discovery
          # axis and the replay axis are bit-for-bit comparable.
          failed=()
          for seed in "${seeds[@]}"; do
            echo "::group::seed=${seed}"
            if MOONPOOL_SEED="${seed}" cargo test \
                -p magnetar-runtime-moonpool \
                --no-default-features --features crypto-aws-lc-rs --locked; then
              echo "::endgroup::"
              echo "  seed=${seed}: PASS (consider removing from the registry in the same PR)"
            else
              echo "::endgroup::"
              echo "::error title=Open seed reproduced::seed=${seed} reproduces; see ADR-0047."
              failed+=("${seed}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Seeds that still reproduce: ${failed[*]}"
            exit 1
          fi
          echo "All open seeds passed — registry entries are stale and should be cleaned up."

  doc:
    name: doc
    runs-on: ubuntu-26.04
    # 60 min: rustdoc on the workspace under `-D warnings` has the same
    # cold-cache compile cost as the build job (it depends on every
    # crate's `cargo check` graph) plus the doc generation pass.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ADR-0029: `auth-sasl-kerberos` → `libgssapi` needs MIT KRB5
      # headers for the rustdoc build under `--all-features`.
      - name: Install libkrb5-dev + libclang-dev (for libgssapi via bindgen)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - run: cargo doc --workspace --all-features --no-deps --locked
      # `AvroSchema` exists only under `schema-avro` (ADR-0117), so a plain
      # intra-doc link to it from always-compiled docs resolves under
      # `--all-features` and breaks the default build. Document that build too.
      - run: cargo doc -p magnetar-proto --no-deps --locked
      # An intra-doc link to an `admin`- or `moonpool`-gated item resolves
      # under `--all-features` and breaks the default build. Document the
      # façade with its default features too.
      - run: cargo doc -p magnetar-driver --no-deps --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  no-channels:
    name: no-channels
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-no-channels

  no-io-deps:
    name: no-io-deps (magnetar-proto)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-no-io-deps

  no-internal-clock:
    name: no-internal-clock (magnetar-proto)
    # Asserts `magnetar-proto/src/**` never reads the host clock outside
    # `#[cfg(test)]` blocks: no `Instant::now()`, no `SystemTime::now()`, no
    # `.elapsed()`, and no file allowlist. Mirrors ADR-0011
    # (clock-injection-sans-io) as amended by ADR-0084. The sans-io state
    # machine must receive `now: Instant` / `wall_clock` providers from the
    # engine.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-no-internal-clock

  log-fields:
    name: log-fields (structured logging)
    # Asserts every `error!` / `warn!` / `info!` tracing event in non-test
    # workspace code carries at least one structured field (`debug!` /
    # `trace!` exempt). Macro invocations are parsed parenthesis-balanced so
    # multi-line invocations are classified whole. Mirrors ADR-0054.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-log-fields

  e2e-fixture:
    name: e2e-fixture (shared Pulsar fixture)
    # Asserts the e2e suite boots Pulsar only through the shared fixture under
    # crates/magnetar/tests/common/ (ADR-0115), that the fixture caps the JVM
    # with `.with_env_var("PULSAR_MEM", …)` before `.start()` (the image
    # default costs ~2.3 GiB RSS per container; four uncapped standalones stall
    # brokers past `operation_timeout` and surface as a flaky timeout in
    # whichever unrelated test is running — docs/testing.md § "e2e container
    # memory budget"), and that the fixture's tag constants plus the `pulsar:`
    # axis of the e2e jobs (ADR-0116) equal the `docker pull
    # apachepulsar/pulsar:<tag>` list of e2e-pulsar.yml, sit in FIXTURE_TAGS of
    # scripts/performance_campaign.py and match the PIP-33 compose pin.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-e2e-fixture

  msrv:
    name: msrv (1.95)
    # Pin-check against the workspace MSRV declared in `Cargo.toml`
    # (`[workspace.package] rust-version = "1.95"`). Builds the whole
    # workspace with `--all-features` on Rust 1.95 so that
    # accidental use of newer language or `std` features fails CI rather
    # than slipping into a release. Mirrors the `build` job but with the
    # toolchain pinned exactly to the MSRV, not the rolling stable.
    runs-on: ubuntu-26.04
    # 90 min: same cold-cache cost as the `build` job (FIPS C build,
    # workspace `--all-features`, bindgen via libclang).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # ADR-0029: `auth-sasl-kerberos` → `libgssapi` needs MIT KRB5
      # headers under `--all-features`.
      - name: Install libkrb5-dev + libclang-dev (for libgssapi via bindgen)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - run: cargo build --workspace --all-features --locked

  codegen-check:
    name: codegen drift (magnetar-proto)
    # Verify-only run of `cargo xtask codegen --check`. Fails if the
    # committed `magnetar-proto/src/pb/` contents diverge from what
    # regenerating from the vendored proto files would produce. Mirrors
    # the validation chain documented in `CLAUDE.md`; without this gate
    # proto codegen drift would go silent.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `prost-build` (xtask codegen) shells out to `protoc`. The other
      # workspace jobs rely on `cargo build`-time vendored bins via
      # `protobuf-src` (transitive through `prost-build`'s build deps),
      # but the standalone xtask invocation expects `protoc` on PATH.
      - name: Install protoc (for prost-build via xtask codegen)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo run --manifest-path xtask/Cargo.toml -- codegen --check

  check-sim-coverage:
    name: check-sim-coverage (isolated Moonpool + Tokio patch coverage)
    # ADR-0024 requires 100% moonpool patch coverage on the diff. ADR-0092
    # flips the gate to enforcing and gives it the per-PR home it never had.
    # `xtask-gates.yml` still carries the same job on its daily cron and on
    # `workflow_dispatch`, but both scheduled runs target `main`, where
    # `merge-base(origin/main, HEAD) == HEAD` empties the diff and the check
    # short-circuits before building anything — so until this job existed the
    # gate had never measured a real pull request.
    #
    # This job running red does NOT by itself block a merge: that takes a
    # branch-protection rule naming it a required check, which lives in
    # repository settings and not in this tree. See ADR-0092 § Required check.
    #
    # Cost. The check is a *diff* gate and bails with "nothing to verify"
    # before compiling anything when every added production `.rs` line is
    # excluded — `xtask/`, `.github/`, `docs/`, `specs/`, `tasks/`,
    # `.claude/`, `crates/magnetar-proto/src/pb/`, any `/tests/`,
    # `/benches/`, `/examples/` path, and anything inside a `#[cfg(test)]`
    # span (SIM_COVERAGE_EXCLUDE_PREFIXES /
    # SIM_COVERAGE_EXCLUDE_FRAGMENTS in xtask/src/main.rs, which is the
    # authority). Note what that does NOT cover: the bail is not keyed on
    # SIM_COVERAGE_GATED_CRATE_PREFIXES, so a PR touching only a crate the
    # sim run never compiles — magnetar-admin, magnetarctl, or another package
    # outside the seven-plus-one coverage domains — still pays the full instrumented
    # build and then prints those files as advisory `not gated`. The façade
    # and fakes are compiled and hard-gated through the differential aggregate
    # suites. The older 30/60/10 measurement predates that closure expansion
    # and is not used to characterize the current job.
    runs-on: ubuntu-26.04
    # 180 to match the two comparable `--all-features` jobs (`test` above,
    # `crypto-matrix` in xtask-gates.yml) rather than the 90 the scheduled
    # copy budgets. That 90 was only ever binding on a `workflow_dispatch`
    # run, since the scheduled one short-circuits; this job is meant to gate, so
    # a cold-cache cancel here is a false red on someone's PR.
    timeout-minutes: 180
    steps:
      # fetch-depth: 0 + an explicit fetch of origin/main so the xtask's
      # `git merge-base origin/main HEAD` resolves. The default shallow
      # checkout has no merge base and the gate cannot compute a diff at all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `--force` + a leading `+` on the refspec. Without them a
      # non-fast-forward update — `main` force-pushed, or
      # `refs/remotes/origin/main` already present at a diverged commit —
      # is REJECTED, and the old `|| git fetch origin main` fallback could
      # not repair it: that form writes only FETCH_HEAD and never creates
      # `refs/remotes/origin/main`. The step still exited 0 and the xtask
      # then died in `git_merge_base` with "could not resolve merge-base
      # against `origin/main`" — a red check for an infrastructure reason,
      # wearing a message that reads like a coverage failure.
      - run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main
      # check-sim-coverage runs two fresh all-feature domains: Moonpool +
      # differential for shared/sim source, then Tokio unit/integration tests
      # for private Tokio adapter source. Their targets, profiles, objects and
      # reports are disjoint under one invocation-owned scratch root (ADR-0121).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          preinstalled-runtimes: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # --all-features can transitively pull libgssapi (auth-sasl-kerberos),
      # so the MIT KRB5 / libclang headers go in like every other
      # --all-features job. `clang` and `llvm` are the crypto-matrix
      # requirement repeated here: --all-features includes crypto-fips, and
      # the gate exports CC/CXX/ASM=clang plus AR/RANLIB=llvm-ar/llvm-ranlib
      # for that build (xtask's force_clang_toolchain), so those five tools
      # must exist. `libclang-dev` ships the bindgen shared library, not the
      # clang driver and not the llvm binutils, and the free-disk-space step
      # above purges `^llvm-.*` from the runner image exactly as it does in
      # the crypto-matrix job — where its absence surfaced as cc-rs
      # `failed to find tool "llvm-ar"`.
      - name: Install clang + llvm + libclang-dev + libkrb5-dev (aws-lc, FIPS delocate, GSSAPI)
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev libkrb5-dev
      # `--enforce` is redundant since ADR-0092 flipped
      # SIM_COVERAGE_ENFORCES_UNCOVERED to true, and is passed anyway so this
      # workflow states its own intent and keeps gating if that constant is
      # ever flipped back. The constant itself is pinned by
      # `sim_coverage_enforces_uncovered_by_default` in xtask/src/main.rs,
      # since this flag would otherwise mask such a regression.
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-sim-coverage --enforce
      - name: Upload fresh simulation coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sim-coverage-reports-${{ github.sha }}
          path: |
            target/sim-coverage.lcov
            target/tokio-coverage.lcov
          if-no-files-found: warn

  # NOTE: the moonpool deterministic-simulation seed sweep lives in its
  # own workflow, `moonpool-seed-sweep.yml`, which runs daily on a cron
  # schedule with 128 freshly-generated random seeds in parallel. Per
  # ADR-0036, fixed seeds in per-PR / per-push CI are useless — they
  # always cover the same scheduling — while random seeds over time
  # cover the seed space much better. The regular `test` job above
  # still exercises `magnetar-runtime-moonpool` under the default seed
  # on every PR / push.

  # ADR-0098 splits the former aggregate test job into one non-e2e cell and
  # four e2e cells, and ADR-0116 runs those four once per Pulsar version
  # (e2e-pulsar.yml). The local canonical command remains one
  # `cargo test --workspace --all-features` invocation per ADR-0046.

  mutants-smoke:
    name: cargo-mutants smoke (magnetar-proto)
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: cargo mutants --package magnetar-proto --timeout 60 --no-shuffle

  fuzz-smoke:
    name: cargo-fuzz smoke (magnetar-proto)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz decode_one (60s budget)
        working-directory: crates/magnetar-proto
        run: cargo +nightly fuzz run decode_one -- -max_total_time=60 -timeout=10
      - name: Fuzz encode_roundtrip (60s budget)
        working-directory: crates/magnetar-proto
        run: cargo +nightly fuzz run encode_roundtrip -- -max_total_time=60 -timeout=10
