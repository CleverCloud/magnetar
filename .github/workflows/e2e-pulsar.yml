name: e2e (reusable)

# The whole Docker-bound e2e suite on ONE Pulsar broker version, as the four
# shards of ADR-0098. Reusable on purpose (ADR-0116): `ci.yml` calls it for
# every pull request with the default broker and Pulsar 5.0.0, and
# `e2e-nightly.yml` calls it for the 4.0 LTS, so there is one shard script and
# one step list to keep correct. The Pulsar axis lives only in the callers'
# `pulsar:` values; `cargo run -p xtask -- check-e2e-fixture` reads them and
# fails when they drift from the tag constants of
# crates/magnetar/tests/common/pulsar.rs, FIXTURE_TAGS of the performance
# campaign or the PIP-33 compose pin.
#
# `inputs.pulsar` reaches the suite as MAGNETAR_PULSAR_IMAGE_TAG, which every
# `Broker::Default` suite honours. Its value is a static literal from a caller
# matrix, never user input; the first step still rejects anything that is not a
# tag so the interpolation into the pre-pull below cannot become a script.
#
# A called workflow does not inherit the caller's `env:`, so it is repeated here.

on:
  workflow_call:
    inputs:
      pulsar:
        description: Exact Pulsar image tag every Broker::Default suite runs on.
        type: string
        required: true
      pip33:
        description: >-
          Bring up the PIP-33 two-cluster compose fixture in shard 4 and run
          e2e_replicated_subscriptions there. That fixture is a 4.2.5 fixture,
          pinned to the default tag, and ignores `pulsar`, so only the 4.2.5 run
          sets this; the other runs skip that one target (ADR-0116 decision 4).
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  e2e:
    name: e2e ${{ matrix.label }}${{ inputs.pip33 && matrix.shard == 3 && ' + PIP-33' || '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: 1/4
          - shard: 1
            label: 2/4
          - shard: 2
            label: 3/4
          - shard: 3
            label: 4/4
    steps:
      - name: Check the Pulsar tag is a plain version
        env:
          PULSAR_TAG: ${{ inputs.pulsar }}
        run: |
          if ! [[ "$PULSAR_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'$PULSAR_TAG' is not an exact Pulsar version tag"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          preinstalled-runtimes: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libkrb5-dev + libclang-dev (for libgssapi via bindgen)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - name: Pre-pull Pulsar broker images
        run: |
          # The axis tag first (`${{ inputs.pulsar }}`, what every Broker::Default suite boots),
          # then one line per tag constant of crates/magnetar/tests/common/pulsar.rs that a
          # suite pins whatever the axis is: V4_LTS_TAG (the test that a pre-5.0 broker refuses
          # scalable topics) and SCALABLE_TAG (the PIP-460 tests). `check-e2e-fixture` keeps
          # these lines equal to the constants plus the callers' `pulsar:` values (ADR-0115,
          # ADR-0116). A cell therefore pulls only what it can boot: 4.0.14 never reaches a
          # pull-request run, while 5.0.0 (the PIP-460 pin, Pulsar 5.0.0 GA) reaches every
          # run, the nightly included, because e2e_scalable_topic runs in all of them.
          docker pull apachepulsar/pulsar:${{ inputs.pulsar }}
          docker pull apachepulsar/pulsar:4.2.5
          docker pull apachepulsar/pulsar:5.0.0
      - name: Pre-pull KDC image (for the SASL Kerberos e2e)
        run: docker pull gcavalcante8808/krb5-server:alpine_3.19.0
      - name: Pre-pull Athenz ZTS image
        run: docker pull athenz/athenz-zts-server:1.12.47
      - name: Bring up two-cluster Pulsar fixture (PIP-33)
        if: ${{ inputs.pip33 && matrix.shard == 3 }}
        working-directory: crates/magnetar/tests/fixtures
        run: |
          set -euo pipefail
          docker compose -f docker-compose.replicated-subs.yml up -d
          for url in http://localhost:18080/admin/v2/brokers/health \
                     http://localhost:18081/admin/v2/brokers/health; do
            attempts=60
            until curl -sf "$url" >/dev/null; do
              attempts=$((attempts - 1))
              if [ "$attempts" -le 0 ]; then
                echo "broker @ $url did not become healthy in time"
                docker compose -f docker-compose.replicated-subs.yml ps
                docker compose -f docker-compose.replicated-subs.yml logs --tail=200
                exit 1
              fi
              sleep 2
            done
          done
      - name: Assert pulsar-init registered both clusters (regression guard, issue #389)
        if: ${{ inputs.pip33 && matrix.shard == 3 }}
        run: |
          set -euo pipefail
          for url in http://localhost:18080 http://localhost:18081; do
            attempts=30
            until clusters=$(curl -sf "$url/admin/v2/clusters") \
              && grep -q '"cluster-a"' <<<"$clusters" \
              && grep -q '"cluster-b"' <<<"$clusters"; do
              attempts=$((attempts - 1))
              if [ "$attempts" -le 0 ]; then
                echo "pulsar-init did not register both clusters at $url: ${clusters:-<no response>}"
                exit 1
              fi
              sleep 2
            done
            echo "$url -> $clusters"
          done
      - name: Configure peer clusters + replicated subscription status
        if: ${{ inputs.pip33 && matrix.shard == 3 }}
        working-directory: crates/magnetar/tests/fixtures
        run: ./configure_replicated_subs.sh
      - name: Run e2e shard
        env:
          MAGNETAR_PULSAR_IMAGE_TAG: ${{ inputs.pulsar }}
          PIP33_FIXTURE: ${{ inputs.pip33 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          shard=${{ matrix.shard }}
          regular_index=0
          selected=0
          paths=(crates/magnetar/tests/e2e_*.rs)
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "no e2e test targets found"
            exit 1
          fi
          mapfile -t paths < <(printf '%s\n' "${paths[@]}" | sort)
          for path in "${paths[@]}"; do
            target="${path##*/}"
            target="${target%.rs}"
            if [ "$target" = e2e_replicated_subscriptions ]; then
              assigned=3
            else
              assigned=$((regular_index % 4))
              regular_index=$((regular_index + 1))
            fi
            if [ "$assigned" -ne "$shard" ]; then
              continue
            fi
            # The one operator-accepted target skip (ADR-0116 decision 4):
            # e2e_replicated_subscriptions talks to the PIP-33 two-cluster compose
            # fixture on fixed ports and never boots a broker of the `pulsar` axis.
            # That compose is a 4.2.5 fixture and only the 4.2.5 run brings it up, so
            # selecting the target elsewhere would fail on a refused connection.
            # Porting it to 5.0 and 4.0 is separate work.
            if [ "$target" = e2e_replicated_subscriptions ] && [ "$PIP33_FIXTURE" != true ]; then
              echo "::notice::$target is a 4.2.5 fixture target (PIP-33 compose) and is not selected on Pulsar $MAGNETAR_PULSAR_IMAGE_TAG"
              continue
            fi
            selected=$((selected + 1))
            echo "::group::$target"
            if [ "$target" = e2e_scalable_topic ]; then
              cargo build -p magnetarctl --all-features --locked
            fi
            cargo test -p magnetar-driver --all-features --locked --test "$target" -- --nocapture
            echo "::endgroup::"
          done
          if [ "$selected" -eq 0 ]; then
            echo "e2e shard $shard selected no test targets"
            exit 1
          fi
          echo "e2e shard $shard ran $selected test targets on Pulsar $MAGNETAR_PULSAR_IMAGE_TAG"
      - name: Dump two-cluster broker logs on failure
        if: ${{ failure() && inputs.pip33 && matrix.shard == 3 }}
        working-directory: crates/magnetar/tests/fixtures
        run: docker compose -f docker-compose.replicated-subs.yml logs --tail=500 || true
      - name: Tear down two-cluster fixture
        if: ${{ always() && inputs.pip33 && matrix.shard == 3 }}
        working-directory: crates/magnetar/tests/fixtures
        run: docker compose -f docker-compose.replicated-subs.yml down -v || true
