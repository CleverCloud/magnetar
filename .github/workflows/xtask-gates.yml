name: xtask gates

# The three xtask validation-chain gates that CLAUDE.md / GUIDELINES.md
# (ADR-0024, ADR-0035) require to be CI-enforced:
#
#   - check-runtime-test-parity : tokio <-> moonpool 1:1 test count (ADR-0024)
#   - check-crypto-matrix       : per-provider build matrix incl. FIPS (ADR-0035)
#   - check-sim-coverage        : 100% patch coverage on the diff, over every
#                                 crate the sim run instruments (ADR-0024)
#
# Runtime parity and the crypto build matrix run on every pull request, daily
# on a cron (like the moonpool seed sweep, ADR-0036), and on manual dispatch.
# Sim coverage already runs in `ci.yml` for pull requests targeting `main`;
# this workflow's copy covers every other pull-request target as well as
# scheduled and manually dispatched runs.
#
# NOTE on check-sim-coverage: it is a *diff* gate (lines added relative to
# `git merge-base origin/main HEAD`). On the scheduled run against `main`
# that diff is empty, so it short-circuits with "nothing to verify" and
# never builds the instrumented binaries. It does real work on a
# `workflow_dispatch` from a feature branch or on a pull request targeting a
# branch other than `main` when the diff touches one of the gated crates.
#
# Sim-coverage gating for pull requests targeting `main` remains `ci.yml`'s
# responsibility and no longer belongs to the developer's local validation
# chain alone: ADR-0092 added its `check-sim-coverage` job there (making it a
# required check is a branch-protection step outside this tree — see ADR-0092).
# This copy covers other pull-request targets, the dispatchable-against-any-
# branch case, and the daily heartbeat that proves the gate still builds.
#
# SCOPE of check-sim-coverage: the run executes only the moonpool +
# differential test binaries, but it reports coverage over every crate that
# run compiles — `magnetar-proto`, `magnetar-runtime-tokio`,
# `magnetar-runtime-moonpool`, `magnetar-differential`,
# `magnetar-auth-athenz` and `magnetar-auth-sasl`. An added line in one of
# those that the sim run never executes is REPORTED with a count and FAILS
# the job: ADR-0092 flipped `SIM_COVERAGE_ENFORCES_UNCOVERED` to `true`,
# superseding ADR-0090's advisory landing, so no flag is needed to get the
# verdict. A second case fails too, and did so even while the verdict was
# advisory — an added file whose whole gated crate emitted no coverage
# records at all, which means the gate could not measure rather than that a
# test is missing.
# The `magnetar-driver` façade is deliberately not compiled here —
# its e2e suite is Docker-bound (ADR-0046) — so façade additions still print
# as advisory `not gated` lines and cannot fail the job. That is a scope
# limit rather than a verdict, and no setting of the constant turns it fatal.
#
# Security note: no `github.event.*` inputs are interpolated anywhere in
# this workflow.

on:
  pull_request:
  schedule:
    # 04:17 UTC daily. Off-the-hour, and offset from the 03:17 seed sweep to
    # avoid contention.
    - cron: "17 4 * * *"
  workflow_dispatch:

# Every job is read-only. Keep pull requests from forks on the repository's
# least-privilege token instead of inheriting a mutable repository default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  runtime-test-parity:
    name: runtime-test-parity
    # Greps the tokio + moonpool test-attribute counts; no build, no apt
    # deps. Compiling the xtask binary itself does not need protoc (only
    # `xtask codegen` does — see ci.yml's codegen-check job).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-runtime-test-parity

  crypto-matrix:
    name: crypto-matrix (per-provider incl. FIPS)
    # 16 `cargo build` cells: facade x {aws-lc-rs,ring,openssl,fips} x
    # {tokio, tokio+moonpool} plus the magnetar-auth-athenz signer matrix.
    # The FIPS cells build aws-lc-fips-sys's C library, so reclaim runner
    # disk like the test / e2e jobs do.
    runs-on: ubuntu-26.04
    # 180 min covers the 16-cell build matrix on a cold cache. The FIPS
    # cells alone take ~10–15 min each on the runner; non-FIPS cells
    # ~3–5 min. Previous 120 was tight and led to mid-matrix cancels on
    # cold runs after the crypto provider expansion.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          tool-cache: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `aws-lc-sys` 0.41+ (pulled in by every non-FIPS crypto cell via
      # rustls' aws_lc_rs provider) runs its `compiler_features_tests`
      # probe through `clang` and PANICS if the tool is not found. The
      # FIPS cells need clang too — `aws-lc-fips-sys`'s `delocate` step
      # only accepts clang-emitted assembly (see the workspace memory
      # `reference-fips-needs-clang-on-linux`). Install clang + libclang
      # headers so every cell of the matrix builds. Also install the
      # libgssapi headers for the `auth-sasl-kerberos` feature path.
      - name: Install clang + llvm + libclang-dev + libkrb5-dev (aws-lc, FIPS delocate, GSSAPI)
        # `llvm` ships the unversioned /usr/bin/llvm-ar + /usr/bin/llvm-ranlib
        # that the job-level AR/RANLIB env below points at for every cell (not
        # just the FIPS ones — the env is set at step level, whereas xtask's
        # apply_fips_toolchain only sets it for crypto-fips). `clang` alone does
        # not pull llvm-ar in, and the earlier free-disk-space step purges any
        # `^llvm-.*` the runner image shipped, so without this cc-rs (building
        # the zstd-sys C dep) fails the whole matrix with
        # `failed to find tool "llvm-ar"`.
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev libkrb5-dev
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-crypto-matrix
        env:
          CC: clang
          CXX: clang++
          ASM: clang
          AR: llvm-ar
          RANLIB: llvm-ranlib

  sim-coverage:
    name: sim-coverage (patch coverage, sim-instrumented crates)
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'main' }}
    runs-on: ubuntu-26.04
    # Budget for one instrumented `--all-features` build of the moonpool +
    # differential test binaries and their dependency closure
    # (aws-lc-fips-sys included) plus the sim run itself. Widening the
    # report to the six crates named in the header note cost no extra
    # compilation — it is a second `cargo llvm-cov report` over artifacts
    # already on disk — so this number did not move with that change. It
    # Pull requests get the same 180-minute budget as the equivalent per-PR
    # copy in `ci.yml`; a cold-cache cancellation would be a false red. The
    # existing scheduled and manually dispatched domains retain 90 minutes.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 180 || 90 }}
    steps:
      # fetch-depth: 0 + the explicit comparison-base fetch below make the
      # xtask's `git merge-base origin/main HEAD` resolve. On the scheduled
      # `main` run the merge-base is HEAD, so the check short-circuits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The xtask compares against the local `origin/main` name. For a pull
      # request targeting another branch, map that target to the local name;
      # scheduled and manual runs keep `main`. `BASE_REF` is an existing base
      # repository ref, passed through the environment and quoted in the
      # refspec instead of being interpolated into the shell program.
      # `--force` + leading `+` let the mapping replace any checkout-created
      # remote-tracking ref that points elsewhere.
      - name: Fetch comparison base
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --force origin "+refs/heads/${BASE_REF}:refs/remotes/origin/main"
      # check-sim-coverage runs `cargo llvm-cov --all-features` over the
      # moonpool + differential test binaries — which builds aws-lc-fips-sys
      # under coverage instrumentation — then re-exports the same profile
      # data over the wider report package set. Reclaim disk like the heavy
      # build jobs.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          tool-cache: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # --all-features can transitively pull libgssapi (auth-sasl-kerberos),
      # so the MIT KRB5 / libclang headers go in like every other
      # --all-features job. `clang` and `llvm` are the crypto-matrix
      # requirement repeated here: --all-features includes crypto-fips, and
      # the gate exports CC/CXX/ASM=clang plus AR/RANLIB=llvm-ar/llvm-ranlib
      # for that build (xtask's force_clang_toolchain — apply_fips_toolchain
      # is the check-crypto-matrix wrapper, a different call site), so those
      # five tools
      # must exist. `libclang-dev` ships the bindgen shared library, not the
      # clang driver and not the llvm binutils, and the free-disk-space step
      # above purges `^llvm-.*` from the runner image exactly as it does in
      # the crypto-matrix job — where its absence surfaced as cc-rs
      # `failed to find tool "llvm-ar"`.
      - name: Install clang + llvm + libclang-dev + libkrb5-dev (aws-lc, FIPS delocate, GSSAPI)
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev libkrb5-dev
      - run: cargo run --manifest-path xtask/Cargo.toml -- check-sim-coverage
