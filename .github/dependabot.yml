# Dependabot configuration for magnetar.
#
# - Cargo: weekly bumps for the main workspace and the independent fuzz
#   workspace. Keeps both manifests within reach of upstream security patches
#   without flooding review queues with daily noise.
# - GitHub Actions: weekly bumps for the workflows under `.github/workflows/`.
#   Catches pinned-action drift (e.g. `dtolnay/rust-toolchain`,
#   `Swatinem/rust-cache`, `actions/checkout`) before it rots.
#
# This is intentionally minimal — extend with grouping, ignore rules, or
# reviewers as the project grows.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/magnetar-proto/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
