[package]
name        = "magnetar-proto"
description = "Sans-io Apache Pulsar wire protocol — encode/decode, framing, state machines. No I/O dependencies. No channels."
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
readme        = "README.md"
keywords      = { workspace = true }
categories    = { workspace = true }

[lints]
workspace = true

[features]
# PIP-460 scalable topics (ADR-0093, amended by ADR-0095). Default OFF.
# The wire types are vendored from Apache Pulsar 5.0.0-M1 and generated
# unconditionally into `pb/pulsar.proto.rs`, so this flag gates **client
# logic only**: the `dag_watch` and `scalable_consumer` state machines, the
# `Conn` entries, and the new `ConnectionEvent` variants. The hand-encoded
# `src/pb/scalable_topics.rs` module it used to gate is deleted — it was a
# projection of a Draft proposal that matched no broker. `MessageId` is not
# extended: M1 carries no segment field on `MessageIdData`. No new
# dependency — `prost` is already in the dependency set.
default          = []
scalable-topics  = []
# FoundationDB-style buggify fault-injection points (ADR-0048). Default
# OFF — when the feature is disabled, every `Buggify::should_fire` call
# collapses to `#[inline(always)] -> false`, so the four named choice
# points in the connection state machine compile to their production
# behaviour with zero runtime overhead. Enabling the feature turns each
# label into a seed-controlled RNG roll routed through the engine's
# `RandomProvider` (sans-io: the proto layer never reaches for the host
# RNG; the engine plugs a closure in via `Connection::set_buggify`
# and `Backoff::install_buggify`, per-label filtered through
# `Buggify::with_rng_and_filter` under ADR-0097 swarm configurations).
# Tests opt in via the moonpool integration suite.
buggify          = []

[dependencies]
bytes        = { workspace = true }
crc32c       = { workspace = true }
prost        = { workspace = true }
# Well-known `google.protobuf` descriptor types used by `ProtobufSchema`
# to advertise a canonical `FileDescriptorProto` as `schema_data` (broker
# parity with the Java client's PROTOBUF_NATIVE descriptor wrapping).
# Pure Rust, zero I/O — verified via `cargo xtask check-no-io-deps`.
prost-types  = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
slab         = { workspace = true }
uuid         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
apache-avro  = { workspace = true }
schemars     = { workspace = true }
hdrhistogram = { workspace = true }
# Sync primitive only — no I/O, no async, no networking.
# Used by ProducerSlot / ConsumerSlot for the per-handle hot lock
# introduced by the split-connection-mutex refactor (see ADR-0038).
# Already a workspace dep used by the runtime crates.
parking_lot  = { workspace = true }
# FxHash for the producer's `pending_index` and the consumer's
# `batch_ack_tracker` hot maps. SipHash is overkill on u64-shaped
# keys we control end-to-end.
rustc-hash   = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
rstest    = { workspace = true }
tempfile  = { workspace = true }
# Capturing subscriber for the ADR-0054 log-emission unit tests
# (`tests/log_capture.rs`). Dev-only — the production dependency graph
# stays I/O-free (`cargo run -p xtask -- check-no-io-deps`).
tracing-subscriber = { workspace = true }
