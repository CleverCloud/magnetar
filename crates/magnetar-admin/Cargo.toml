[package]
name        = "magnetar-admin"
description = "Apache Pulsar admin REST client for Rust."
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
readme        = "../../README.md"
keywords      = { workspace = true }
categories    = { workspace = true }

[lints]
workspace = true

[features]
# Pluggable rustls crypto provider (issue #9, ADR-0035). reqwest 0.13's
# `rustls` (renamed from `rustls-tls`) ships a built-in aws-lc-rs provider;
# `rustls-no-provider` (renamed from `rustls-tls-no-provider`) trusts the
# caller to `install_default()` whichever provider is in use. When more
# than one `crypto-*` feature is enabled (e.g. default `crypto-aws-lc-rs`
# alongside an explicit `crypto-ring`), cargo's feature union resolves
# reqwest to the `rustls-no-provider` flavor, so `AdminClientBuilder::build`
# always calls `tls_crypto::install_default_provider` itself. The cfg
# cascade in `src/tls_crypto.rs` mirrors `magnetar-runtime-tokio` (aws-lc-rs
# wins, then FIPS, then openssl, then ring) so admin standalone matches the
# façade's provider choice without depending on the tokio runtime crate.
# Each crypto-* feature also forwards to `magnetar-auth-oauth2`'s matching
# feature so the OAuth2 token-exchange client (used by `AdminAuth::OAuth2`)
# binds the same rustls provider as the admin reqwest client. Without the
# forward, a single-provider build (`--no-default-features --features
# crypto-ring`) would leave the OAuth2 client's reqwest with no TLS feature
# and every `https://` issuer fail at the connector layer.
crypto-aws-lc-rs = ["reqwest/rustls", "rustls/aws_lc_rs", "magnetar-auth-oauth2/crypto-aws-lc-rs"]
crypto-ring      = ["reqwest/rustls-no-provider", "rustls/ring", "magnetar-auth-oauth2/crypto-ring"]
crypto-openssl   = ["reqwest/rustls-no-provider", "dep:rustls-openssl", "magnetar-auth-oauth2/crypto-openssl"]
crypto-fips      = ["reqwest/rustls-no-provider", "rustls/fips", "magnetar-auth-oauth2/crypto-fips"]
# PIP-460 scalable topics (ADR-0093). Forwards the proto-layer scalable model.
# Default OFF.
scalable-topics  = ["magnetar-proto/scalable-topics"]

[dependencies]
magnetar-proto       = { workspace = true }
magnetar-auth-oauth2 = { workspace = true }
reqwest        = { workspace = true }
rustls         = { workspace = true }
rustls-openssl = { workspace = true, optional = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
url            = { workspace = true }
http           = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
# OAuth2 flow constructor for the `AdminAuth::OAuth2` auth test. Its rustls
# provider is selected by the test build's crypto-* feature (forwarded through
# this crate's own crypto features).
magnetar-auth-oauth2 = { workspace = true }
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
