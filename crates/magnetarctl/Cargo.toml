[package]
name        = "magnetarctl"
description = "magnetarctl — the Magnetar CLI: produce, consume, inspect, and admin against an Apache Pulsar broker."
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
readme        = "../../README.md"
keywords      = { workspace = true }
categories    = { workspace = true }
publish     = true
build       = "build.rs"

[[bin]]
name = "magnetarctl"
path = "src/main.rs"
# Binary is `magnetarctl`; the façade lib is `magnetar` (package
# `magnetar-driver`). Distinct names, so no rustdoc-dir collision.
# `doc = false` kept: the CLI exposes no library API to document.
doc  = false

[lints]
workspace = true

[features]
default = ["crypto-aws-lc-rs"]

# PIP-460 scalable topics (ADR-0031). Default OFF. Adds the `topic-info`
# subcommand (prints a scalable topic's segment DAG). Propagates the façade's
# experimental scalable surface.
scalable-topics = ["magnetar-driver/scalable-topics", "magnetar-admin/scalable-topics"]

# --- Crypto provider features (ADR-0035). Mirror the façade's pluggable
# rustls crypto backend down into the binary crate. `magnetar-admin` is
# imported directly here (not through the façade's `admin` feature), so
# the cascade has to forward to it explicitly — otherwise reqwest in the
# admin client is compiled without any TLS feature and every `https://`
# admin URL fails at the connector layer. Single-provider builds use
# `--no-default-features --features crypto-<x>`. ---
crypto-aws-lc-rs = [
    "magnetar-driver/crypto-aws-lc-rs",
    "magnetar-admin/crypto-aws-lc-rs",
    "magnetar-auth-oauth2/crypto-aws-lc-rs",
]
crypto-ring = [
    "magnetar-driver/crypto-ring",
    "magnetar-admin/crypto-ring",
    "magnetar-auth-oauth2/crypto-ring",
]
crypto-openssl = [
    "magnetar-driver/crypto-openssl",
    "magnetar-admin/crypto-openssl",
    "magnetar-auth-oauth2/crypto-openssl",
]
crypto-fips = [
    "magnetar-driver/crypto-fips",
    "magnetar-admin/crypto-fips",
    "magnetar-auth-oauth2/crypto-fips",
]

[dependencies]
magnetar-driver      = { workspace = true, default-features = false, features = ["tokio"] }
magnetar-admin       = { workspace = true }
# OAuth2 client-credentials flow for context `auth-info` carrying an
# `issuer_endpoint`. Wired into the admin client via `AdminAuth::OAuth2` and
# into the data-plane client via its `AuthProvider` impl. ADR-0068.
magnetar-auth-oauth2 = { workspace = true }
anstream           = "^1.0.0"
anstyle            = "^1.0.14"
clap               = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
# YAML for the pulsarctl-compatible `~/.config/pulsar/config` context file.
serde_norway       = { workspace = true }
thiserror          = { workspace = true }
url                = { workspace = true }

[dev-dependencies]
# Temp config-file fixtures for the context round-trip + resolution tests.
tempfile = { workspace = true }
