but the test's OWN outer anti-hang guards (previously a 20s guard around
connect, a 5s guard around subscribe) were shorter than or equal to that
20s deadline and fired first, converting an already-handled bounded outcome
into a hard "timed out" test failure before the connection's own recovery
path got a chance to resolve it.

FIXED by introducing `OUTER_GUARD` (25s, strictly longer than the 20s
`operation_timeout` it wraps) and applying it to both the connect and
subscribe steps in `drive`, so the outer backstop can no longer pre-empt
the operation deadline it is meant to merely guard against a genuine driver
stall. Pinned by the
`sim_delayed_marker_regression_368_sub_seed_7383837303657982387` regression
test in replicated_subscriptions_sim.rs, which pins the derived sub-seed
directly via `set_debug_seeds`. RETAINED as a regression anchor — do NOT
remove on a green replay: the per-PR seed-replay re-validates this fix.
