note         = """
Derived sub-seed 2303720487047045006: a DIFFERENT cause from #889 despite
the identical panic site. All four consumers subscribed cleanly; the
controller clogged wire ids 3 and 2; and when the window lifted the broker
wrote their full 8-message backlog (t=110.97ms and t=115.97ms, both writes
successful) and the simulated network lost it. The client's own bounded
recovery was then PRE-EMPTED by the harness: the 2s per-receive() drain
budget fired at t=2.0155s while the client still reported
is_connected() == true — before it had even detected the dead link (it
flipped to false at t=2.0655s) — and the expiring drain task dropped its
Consumer, whose ConsumerCloseGuard enqueued a best-effort CloseConsumer.
Connection::rebuild_consumers skips a closed consumer, so the supervised
reconnect at t~2.294s replayed only the two handles whose drain tasks
happened to still be alive and redelivered the backlog to them alone
(got 8/8 each at t~2.300s). No client defect: the same recovery would have
served the clogged pair had the guard not destroyed them.

FIXED in the harness: the drain phase carries ONE absolute
SWIZZLE_DRAIN_BUDGET (10s virtual) armed before the first receive(),
strictly longer than every client deadline nested inside it
(keepalive_interval 1s, operation_timeout 5s, supervisor mandatory_stop 5s)
and strictly inside CHAOS_RUN_TIME_BUDGET (30s) — which is also what
ADR-0050's "by the end of the sim budget" wording always required. Pinned by
`sim_chaos_swizzle_clog_orphaned_and_preempted_sub_seeds`.
RETAINED as a regression anchor — do NOT remove on a green replay: the
per-PR seed-replay re-validates this fix.
"""

