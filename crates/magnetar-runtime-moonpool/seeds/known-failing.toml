value        = "0x86fe8eb1a656fe8f"
discovered   = "2026-10-24"
workflow_run = "https://github.com/CleverCloud/magnetar/actions/runs/40076790324"
commit_sha   = "0cfbd30a3c148b20c060a84f1826455125994cfa"
test_name    = "moonpool_malformed_mid_session_frame_terminates_driver_not_deadlock"
status       = "open"
issue        = "https://github.com/CleverCloud/magnetar/issues/891"
note         = """
Derived sub-seed 11989488914469334314. The driver did NOT fail to terminate:
with the budget raised the same seed reaches post-timeout state=Failed at
t=60.0507s, closes with nothing pending, and joins Ok -> CleanExit, which is
the ADR-0058 watchdog contract this test already documents as a tolerated
outcome. The failure was the test's own anti-hang guard.

The sim bit-flipped the injected [0,0,0,0] malformed prefix to
[00,00,01,80] (two flips, captured as sim_fault kind="bit_flip"), announcing
total_size 384 inside MAX_FRAME_SIZE. magnetar-proto/src/frame.rs:318-320
then correctly returns Ok(None) for an incomplete frame instead of
BadLength(0), so the driver parks and waits for the rest, as designed. The
connection therefore ends through the keepalive watchdog rather than the
reject path, and escalation costs TWO keepalive intervals
(magnetar-proto/src/conn.rs:4527: the first due tick only sends the ping and
refreshes last_activity), i.e. about 60s at the default 30s interval. The
test's RUN_TIME_BUDGET was 30s, written 2026-06-03 in ef0754b; the
two-interval watchdog landed nine days later in 0ef7717 and nothing
re-checked the relation. Bisected: 30s fails, 31s and above pass with the run
reaching simulated_time 60.0507s.

The #305/#308 pins that were supposed to anchor this CleanExit path no longer
reach it — seed 8009627293563187958 now yields RejectedAndTerminated with
zero bit flips because the prefix arrives split — which is why a budget too
short for the watchdog went unnoticed.

FIXED in the harness: RUN_TIME_BUDGET raised to 150s of virtual time (zero
wall cost) with its arithmetic documented, and the test now ASSERTS
RUN_TIME_BUDGET > connect_timeout + SETTLE_DELAY + 2 * keepalive_interval
computed from ConnectionConfig::default(), so a later default bump fails
loudly instead of silently recreating this issue. The seed is pinned in
CHAOS_REGRESSION_SEEDS. Nothing weakened: observed_reject still demands a
chaos-free BadLength(0), OtherError still hard-fails, and the ADR-0038
re-entrant-mutex regression still hangs the sim thread regardless of budget.
RETAINED as a regression anchor — do NOT remove on a green replay: the
per-PR seed-replay re-validates this fix.
"""
