# --- 2026-11-02 triage of the 2026-10-24 sweep (#889-#892) ---
# Four seeds flagged by one daily run (40076790324) against 0cfbd30. All four
# reproduced locally against f8b7465 at exit 101, across three distinct panic
# sites, and all four are fixed in the changeset that adds these entries.
# Clustered by panic site plus derived sub-seed, not by test name. None was a
# production defect: every one is a sim workload or an anti-hang guard that
# could not survive moonpool-sim's default-on chaos (ADR-0055) — the same two
# shapes the #362-#368 triage recorded. All four are RETAINED as regression
# anchors per the convention above.

[[seed]]
value        = "0x44dd3d23baefd4e0"
discovered   = "2026-10-24"
workflow_run = "https://github.com/CleverCloud/magnetar/actions/runs/40076790324"
commit_sha   = "0cfbd30a3c148b20c060a84f1826455125994cfa"
test_name    = "sim_chaos_swizzle_clog_sweep_16_seeds"
status       = "open"
issue        = "https://github.com/CleverCloud/magnetar/issues/889"
note         = """
Derived sub-seed 3891654041110413884: the sim's bit flip rewrote the first
client->broker SUBSCRIBE's request_id from 1 to 9 while the frame still
decoded (a CONTROL frame — no CRC32C, undetectable by design). The broker
accepted the subscribe, registered wire consumer id 0 and answered request
id 9; the client's pending map held 1, dropped the unmatched Success (as
Java's ClientCnx does), and retry_setup re-issued under wire id 1. Wire id 0
was left ORPHANED — held by the broker, held by no client handle, never
granted flow permits. The swizzle clog pool was keyed on SUBSCRIBE, so it
admitted that orphan, and the controller's 200 x 10ms = 2s readiness window
(exactly one retry_setup ATTEMPT_TIMEOUT) expired at t=2s, 22ms before the
first real consumer existed — so it armed the clog from a registered set
holding nothing but the orphan. n = n_clogged.min(1) = 1 clogged the whole
pool, and the window property then demanded a delivery nothing could read.

FIXED in the harness: the swizzle session registers a clog candidate on the
client's FLOW (permits are granted only to the consumer the client actually
holds), not on SUBSCRIBE, and the controller's readiness wait is bounded
only by the iteration shutdown / run_time_budget instead of a window
shorter than the setup deadline nested inside it. Pinned by
`sim_chaos_swizzle_clog_orphaned_and_preempted_sub_seeds`.
RETAINED as a regression anchor — do NOT remove on a green replay: the
per-PR seed-replay re-validates this fix.
"""

