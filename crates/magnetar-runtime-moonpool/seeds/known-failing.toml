value        = "0xb104b915c362676b"
discovered   = "2026-10-24"
workflow_run = "https://github.com/CleverCloud/magnetar/actions/runs/40076790324"
commit_sha   = "0cfbd30a3c148b20c060a84f1826455125994cfa"
test_name    = "sim_chaos_pulsar_proxy_multi_conn_sweep_8_seeds"
status       = "open"
issue        = "https://github.com/CleverCloud/magnetar/issues/892"
note         = """
Derived sub-seed 3734608893952018932. Chaos dropped the proxy bootstrap
session after it had issued its lookup but before the response resolved. The
supervisor reconnected a second, equally bootstrap-shaped session
(CommandConnect.proxy_to_broker_url absent), but ProxyThroughBroker latched
"the first session to issue a Lookup" for the whole run, so it answered that
NEW bootstrap session proxy_through_service_url = false while still
advertising its own pulsar://broker-sim.proxy.internal:6650. The client
correctly took the DIRECT route that answer names and dialled an authority no
simulated peer owns, so all sixteen retry_setup attempts burned on "pool dial
to broker-sim.proxy.internal:6650 exceeded operation_timeout (10s)" and no
pinned session was ever created. Sixteen distinct lookup request ids were each
answered and each driven to a dial, and the client's own 10s bound fired every
time, which rules out a pending-map or waker defect in the driver. A real
Pulsar Proxy never disowns a lookup arriving on a connection the client made
to it, whatever happened to an earlier connection.

FIXED in the harness: the emulated proxy answers proxy_through from each
session's OWN recorded CONNECT shape (connect_proxy_to_broker_url.is_none()),
and the run-global latch is gone; pinned sessions still get false, so the
redirect-loop tolerance the old comment described is preserved. Pinned by
`sim_chaos_pulsar_proxy_rebootstrap_sub_seed_892`. Noted and deliberately not
changed: retry_setup's 2s ATTEMPT_TIMEOUT is shorter than the client's 10s
operation_timeout — the known fragility shape — but it is not causal here, and
widening it cannot route around an unroutable authority.
RETAINED as a regression anchor — do NOT remove on a green replay: the
per-PR seed-replay re-validates this fix.
"""

