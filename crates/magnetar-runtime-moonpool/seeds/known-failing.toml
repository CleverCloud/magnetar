CRC (ADR-0055), and a real Pulsar Proxy refuses a target it cannot validate.

FIXED in the harness: the emulated proxy refuses an unadvertised
`proxy_to_broker_url`, so the client looks the topic up again and pins a
clean session. Pinned by `sim_chaos_pulsar_proxy_corrupted_broker_host_sub_seed_859`.
