test_name    = "sim_delayed_marker_is_observed_sweep_16_seeds"
status       = "open"
issue        = "https://github.com/CleverCloud/magnetar/issues/365"
note         = """
Derived sub-seed 6405417372729688799 drove a `BitFlip` chaos fault into the
single-shot, CRC32C-covered snapshot-marker `MESSAGE` frame while it was in
flight. magnetar-proto's verify-or-drop policy (invariant #4) silently
dropped the corrupted frame and left the connection alive (`is_closed()`
never flips), so nothing was left to re-notify the parked marker waiter —
the guard on `next_replicated_subscription_marker()` then expired with the
exact same symptom the genuine lost-wakeup bug produces, because this
single-shot push has no retry infrastructure by design.

FIXED by adding `MarkerOutcome::ChaosOrphaned` and classifying the
marker-guard expiry into it, but ONLY when the run's own captured fault
trace (`ctx.observability().snapshot(SIM_FAULT_EVENT_NAME)`) shows a
`BitFlip` actually fired during this run — with no such evidence the hard
`Err` (lost-wakeup failure) still fires, so the strict chaos-free
`sim_delayed_marker_is_observed` anchor is unaffected and a real regression
still fails loudly. Pinned by the
`sim_delayed_marker_regression_365_sub_seed_6405417372729688799` regression
test in replicated_subscriptions_sim.rs, which pins the derived sub-seed
directly via `set_debug_seeds`. RETAINED as a regression anchor — do NOT
remove on a green replay: the per-PR seed-replay re-validates this fix.
"""

