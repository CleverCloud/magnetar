note         = """
Derived sub-seed 16831727181602372843 flipped a single bit in the proxy
lookup response's advertised `broker_service_url`, turning
"pulsar://broker-sim.proxy.internal:6650" into
"ptlsar://broker-sim.proxy.internal:6650". TWO independent defects
compounded: (1) the test-harness assertion (`pinned_clean`) only inspected
sessions via `.skip(1)`/`.first()`, so a corrupted-but-still-connected
pinned session tripped the test even though the proxy multi-connection
contract otherwise held; (2) production code
(`Client::proxy_broker_authority` in
crates/magnetar-runtime-moonpool/src/client.rs) matched neither
`strip_prefix("pulsar+ssl://")` nor `strip_prefix("pulsar://")` on the
corrupted scheme and fell through to a naive `host_port.split('/')`,
silently truncating it into the nonsense authority "ptlsar:" instead of
failing the lookup.

FIXED with TWO changesets per the same commit series: (a) the test-harness
evidence assertions now search ALL recorded sessions for a clean bootstrap
AND a correctly-pinned session, tolerating an EXTRA chaos-damaged session
coexisting rather than requiring none ever occurred; (b) production
`proxy_broker_authority` / `direct_broker_authority` now return
`Result<String, ClientError>` and reject an input containing "://" with an
unrecognised scheme explicitly (ADR-0024 four-layer + e2e obligation met:
proto-level differential equivalence test
`corrupted_broker_scheme_equivalence.rs`, moonpool integration test
`proxy_multi_conn.rs::open_producer_through_proxy_rejects_corrupted_broker_scheme`,
e2e `e2e_moonpool_direct_broker_authority.rs` proving the happy path is
unregressed; no magnetar-proto state-machine change and no tokio-side
behavioural change, both absences argued in the commit message). Pinned by
the `sim_chaos_pulsar_proxy_bootstrap_sub_seeds_362_363_364_367` regression
test in sim_chaos.rs. RETAINED as a regression anchor — do NOT remove on a
green replay: the per-PR seed-replay re-validates BOTH fixes.
"""

