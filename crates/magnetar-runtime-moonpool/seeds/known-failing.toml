# --- 2026-07-27 issue sweep: chaos tolerance in the sim workloads (#362-#368) ---
# Seven seeds the daily sweep flagged between 2026-07-22 and 2026-07-26, all
# reproduced locally against 1b0e44d and all fixed in the changeset that adds
# these entries. None was a production defect in the driver or the connection
# pool: each is a sim workload whose setup path or outer anti-hang guard could
# not survive moonpool-sim's default-on network chaos (ADR-0055), plus one
# genuine moonpool-side broker-URL parsing defect surfaced by a bit flip.
# All seven are RETAINED as regression anchors per the convention above.

[[seed]]
value        = "0x4991627312a29bf3"
discovered   = "2026-07-22"
workflow_run = "https://github.com/CleverCloud/magnetar/actions/runs/29895602266"
commit_sha   = "5d6c39fe86c0a5c2bc0ef17318157948d166af48"
test_name    = "sim_chaos_pulsar_proxy_multi_conn_sweep_8_seeds"
status       = "open"
issue        = "https://github.com/CleverCloud/magnetar/issues/362"
note         = """
Derived sub-seed 17655772840140759888 drove ProxyClientWorkload's bare
11s-timeout connect/open_producer calls into moonpool-sim's default-on
network chaos (ADR-0055): the first bootstrap session died mid-lookup
(frames: []) and the workload had no retry, surfacing "producer target
resolution exceeded operation_timeout" and failing the iteration outright.

FIXED by wrapping ProxyClientWorkload's connect and open_producer calls in
the in-file `retry_setup` helper (bounded, virtual-clock-delayed retries)
and making the bootstrap/pinned evidence assertions search ALL recorded
sessions instead of only `.first()` / `.skip(1)`, so a dead session from an
aborted attempt no longer fails a test whose actual proxy multi-connection
contract still held. Pinned by the
`sim_chaos_pulsar_proxy_bootstrap_sub_seeds_362_363_364_367` regression test
in sim_chaos.rs. RETAINED as a regression anchor — do NOT remove on a green
replay: the per-PR seed-replay re-validates this fix.
"""

